# The app's text lives in lib/l10n/app_<language>.arb; `flutter gen-l10n`
# (run automatically by `flutter pub get` and builds) turns it into
# AppLocalizations. English is the template every other language follows.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
